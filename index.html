<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做續訪神秘圖片大揭 (Firebase)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        h1 { color: #333; margin-bottom: 10px; }

        .image-container {
            position: relative;
            width: 500px;
            height: 400px;
            background-image: url('https://cms-imgp.jw-cdn.org/img/p/1102021260/univ/art/1102021260_univ_cnt_05_lg.jpg');
            background-size: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .overlay-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(7, 1fr);
        }

        .block {
            background-color: #2c3e50;
            border: 0.5px solid #34495e;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

        .block.revealed {
            opacity: 0;
            pointer-events: none;
        }

        .reveal-btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s, opacity 0.2s;
        }

        .reveal-btn:hover { background-color: #0056b3; }

        .reveal-btn.disabled {
            opacity: 0.6;
            pointer-events: none;
            cursor: not-allowed;
            background-color: #6c757d;
        }

        #status-message {
            margin-top: 15px;
            font-weight: bold;
            color: #27ae60;
            text-align: center;
        }

        .admin-reset-btn {
            /* display: none; */ /* Keeps it in code, hides it on screen */
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .admin-reset-btn:hover { color: #e74c3c; }
    </style>
</head>
<body>

    <h1>🔍 做續訪神秘圖片大揭</h1>
    
    <div class="image-container">
        <div class="overlay-grid" id="grid"></div>
    </div>

    <a href="#" class="reveal-btn" id="reveal-link">做 1 個續訪點擊為大家揭曉 1 塊拼圖！</a>
    
    <p id="status-message">正在連線至資料庫...</p>

   <a href="#" class="admin-reset-btn" id="reset-link">⚙️ 重置拼圖狀態</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            onSnapshot, 
            updateDoc, 
            setDoc, 
            arrayUnion 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYvQKj4m0sPwJAH6tO7z7Ze7RYjrmlEJQ",
            authDomain: "rv-mystery-image.firebaseapp.com",
            projectId: "rv-mystery-image",
            storageBucket: "rv-mystery-image.firebasestorage.app",
            messagingSenderId: "44198416860",
            appId: "1:44198416860:web:2582c27e29a0c8dfbc7f19",
            measurementId: "G-LKXEPMXWKD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const puzzleRef = doc(db, "games", "mystery-puzzle-1");

        const gridContainer = document.getElementById('grid');
        const revealLink = document.getElementById('reveal-link');
        const resetLink = document.getElementById('reset-link');
        const statusMessage = document.getElementById('status-message');
        
        const TOTAL_BLOCKS = 70;
        const DAILY_LIMIT = 3;
        let globallyRevealedBlocks = [];
        let previousRevealedCount = 0;
        let victoryTriggered = false;

        // -------------------------------------------------------------
        // 自訂 MP3 音效設定 (請將檔名替換為您的 MP3 檔案路徑)
        // -------------------------------------------------------------
        const popSound = new Audio('pop.mp3');         // 點擊揭曉音效
        const victorySound = new Audio('https://cfp2.jw-cdn.org/a/321f47/1/o/osg_CH_082.mp3'); // 完成揭曉音效

        popSound.volume = 0.5;
        victorySound.volume = 0.7;

        function playPopSound() {
            popSound.currentTime = 0;
            popSound.play().catch(e => console.log("Audio play blocked:", e));
        }

        function playVictoryJingle() {
            victorySound.currentTime = 0;
            victorySound.play().catch(e => console.log("Audio play blocked:", e));
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);

                    confetti({
                        particleCount: 20,
                        startVelocity: 30,
                        spread: 360,
                        ticks: 60,
                        origin: { x: Math.random(), y: Math.random() - 0.2 }
                    });
                }, 250);
            }
        }

        // -------------------------------------------------------------
        // UI 與網格動態生成
        // -------------------------------------------------------------
        for (let i = 0; i < TOTAL_BLOCKS; i++) {
            const block = document.createElement('div');
            block.classList.add('block');
            block.setAttribute('data-id', i);
            gridContainer.appendChild(block);
        }

        onSnapshot(puzzleRef, async (docSnap) => {
            if (!docSnap.exists()) {
                await setDoc(puzzleRef, { revealed: [] });
                globallyRevealedBlocks = [];
            } else {
                globallyRevealedBlocks = docSnap.data().revealed || [];
            }
            syncUI();
        });

        function syncUI() {
            const currentCount = globallyRevealedBlocks.length;

            if (currentCount > previousRevealedCount && previousRevealedCount !== 0) {
                playPopSound();
            }

            document.querySelectorAll('.block').forEach(block => {
                const id = parseInt(block.getAttribute('data-id'), 10);
                if (globallyRevealedBlocks.includes(id)) {
                    block.classList.add('revealed');
                } else {
                    block.classList.remove('revealed');
                }
            });

            const remaining = TOTAL_BLOCKS - currentCount;

            if (remaining === 0) {
                statusMessage.innerText = "🎉 恭喜！完整的圖片已經為大家揭曉囉！";
                revealLink.style.display = 'none';

                if (!victoryTriggered) {
                    victoryTriggered = true;
                    playVictoryJingle();
                    triggerConfetti();
                }
            } else {
                revealLink.style.display = 'inline-block';
                victoryTriggered = false;
                checkDailyLimitStatus(remaining);
            }

            previousRevealedCount = currentCount;
        }

        function getTodayStorageKey() {
            const today = new Date().toISOString().split('T')[0];
            return `reveals_${today}`;
        }

        function checkDailyLimitStatus(remainingGlobal) {
            const storageKey = getTodayStorageKey();
            const todayClicks = parseInt(localStorage.getItem(storageKey) || "0", 10);

            if (todayClicks >= DAILY_LIMIT) {
                statusMessage.innerText = `⚠️ 您今天的 ${DAILY_LIMIT} 次揭曉額度已用完！（全球還剩 ${remainingGlobal} 塊未揭曉）。`;
                revealLink.classList.add('disabled');
                revealLink.innerText = "已達今日點擊上限，如果你今天做過3個多續訪，請明天再按";
            } else {
                const leftToday = DAILY_LIMIT - todayClicks;
                statusMessage.innerText = `全球剩餘 ${remainingGlobal} 塊拼圖。`;
            }
        }

        // -------------------------------------------------------------
        // 事件監聽器
        // -------------------------------------------------------------
        revealLink.addEventListener('click', async function(event) {
            event.preventDefault();
            if (revealLink.classList.contains('disabled')) return;

            const storageKey = getTodayStorageKey();
            let todayClicks = parseInt(localStorage.getItem(storageKey) || "0", 10);

            if (todayClicks >= DAILY_LIMIT) return;

            const hiddenIndices = [];
            for (let i = 0; i < TOTAL_BLOCKS; i++) {
                if (!globallyRevealedBlocks.includes(i)) hiddenIndices.push(i);
            }

            if (hiddenIndices.length > 0) {
                const randomIndex = Math.floor(Math.random() * hiddenIndices.length);
                const blockToReveal = hiddenIndices[randomIndex];
                
                revealLink.classList.add('disabled');
                const originalText = revealLink.innerText;
                revealLink.innerText = "揭曉中...";

                try {
                    await updateDoc(puzzleRef, {
                        revealed: arrayUnion(blockToReveal)
                    });

                    todayClicks++;
                    localStorage.setItem(storageKey, todayClicks);

                } catch (error) {
                    console.error("寫入資料時發生錯誤：", error);
                    statusMessage.innerText = "同步至雲端資料庫時發生錯誤。";
                } finally {
                    if (todayClicks < DAILY_LIMIT) {
                        revealLink.classList.remove('disabled');
                        revealLink.innerText = originalText;
                    } else {
                        revealLink.classList.add('disabled');
                        revealLink.innerText = "已達今日點擊上限";
                    }
                }
            }
        });

        resetLink.addEventListener('click', async function(event) {
            event.preventDefault();
            if (confirm("您確定要為所有人重置拼圖嗎？")) {
                try {
                    await setDoc(puzzleRef, { revealed: [] });
                    const storageKey = getTodayStorageKey();
                    localStorage.setItem(storageKey, 0);
                    statusMessage.innerText = "拼圖狀態已成功重置！";
                } catch (error) {
                    console.error("重置錯誤：", error);
                    statusMessage.innerText = "重置拼圖狀態時發生錯誤。";
                }
            }
        });
    </script>
</body>
</html>
