<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Mystery Image Reveal (Firebase)</title>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .image-container {
            position: relative;
            width: 500px;
            height: 400px;
            background-image: url('https://picsum.photos/500/400');
            background-size: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .overlay-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10 columns */
            grid-template-rows: repeat(8, 1fr);    /* 8 rows = 80 total blocks */
        }

        .block {
            background-color: #2c3e50;
            border: 0.5px solid #34495e;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

        .block.revealed {
            opacity: 0;
            pointer-events: none;
        }

        .reveal-btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s, opacity 0.2s;
        }

        .reveal-btn:hover {
            background-color: #0056b3;
        }

        .reveal-btn.disabled {
            opacity: 0.6;
            pointer-events: none;
            cursor: not-allowed;
            background-color: #6c757d;
        }

        #status-message {
            margin-top: 15px;
            font-weight: bold;
            color: #27ae60;
            text-align: center;
        }

        /* Subtle Hidden Admin Reset Control */
        .admin-reset-btn {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .admin-reset-btn:hover {
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <h1>🔍 Global Mystery Picture Reveal</h1>
    
    <div class="image-container">
        <div class="overlay-grid" id="grid"></div>
    </div>

    <a href="#" class="reveal-btn" id="reveal-link">Click to Reveal 1 Piece for Everyone!</a>
    
    <p id="status-message">Connecting to database...</p>

    <!-- Discreet Admin Reset Link -->
    <a href="#" class="admin-reset-btn" id="reset-link">⚙️ Reset Puzzle State</a>

    <!-- Load Firebase v10 JavaScript SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            onSnapshot, 
            updateDoc, 
            setDoc, 
            arrayUnion 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDYvQKj4m0sPwJAH6tO7z7Ze7RYjrmlEJQ",
            authDomain: "rv-mystery-image.firebaseapp.com",
            projectId: "rv-mystery-image",
            storageBucket: "rv-mystery-image.firebasestorage.app",
            messagingSenderId: "44198416860",
            appId: "1:44198416860:web:2582c27e29a0c8dfbc7f19",
            measurementId: "G-LKXEPMXWKD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const puzzleRef = doc(db, "games", "mystery-puzzle-1");

        const gridContainer = document.getElementById('grid');
        const revealLink = document.getElementById('reveal-link');
        const resetLink = document.getElementById('reset-link');
        const statusMessage = document.getElementById('status-message');
        
        const TOTAL_BLOCKS = 80;
        const DAILY_LIMIT = 3;
        let globallyRevealedBlocks = [];
        let previousRevealedCount = 0;
        let victoryTriggered = false;

        // -------------------------------------------------------------
        // Web Audio Synthesizer Sounds
        // -------------------------------------------------------------
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playVictoryJingle() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
            
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const startTime = audioCtx.currentTime + (index * 0.12);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                
                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);

                    confetti({
                        particleCount: 20,
                        startVelocity: 30,
                        spread: 360,
                        ticks: 60,
                        origin: { x: Math.random(), y: Math.random() - 0.2 }
                    });
                }, 250);
            }
        }

        // -------------------------------------------------------------
        // UI & Grid Generation
        // -------------------------------------------------------------
        for (let i = 0; i < TOTAL_BLOCKS; i++) {
            const block = document.createElement('div');
            block.classList.add('block');
            block.setAttribute('data-id', i);
            gridContainer.appendChild(block);
        }

        onSnapshot(puzzleRef, async (docSnap) => {
            if (!docSnap.exists()) {
                await setDoc(puzzleRef, { revealed: [] });
                globallyRevealedBlocks = [];
            } else {
                globallyRevealedBlocks = docSnap.data().revealed || [];
            }
            syncUI();
        });

        function syncUI() {
            const currentCount = globallyRevealedBlocks.length;

            // Play pop sound when new blocks are uncovered
            if (currentCount > previousRevealedCount && previousRevealedCount !== 0) {
                playPopSound();
            }

            document.querySelectorAll('.block').forEach(block => {
                const id = parseInt(block.getAttribute('data-id'), 10);
                if (globallyRevealedBlocks.includes(id)) {
                    block.classList.add('revealed');
                } else {
                    block.classList.remove('revealed');
                }
            });

            const remaining = TOTAL_BLOCKS - currentCount;

            // Completion check
            if (remaining === 0) {
                statusMessage.innerText = "🎉 The picture is fully revealed for everyone!";
                revealLink.style.display = 'none';

                if (!victoryTriggered) {
                    victoryTriggered = true;
                    playVictoryJingle();
                    triggerConfetti();
                }
            } else {
                revealLink.style.display = 'inline-block';
                victoryTriggered = false; // Reset flag if board was reset
                checkDailyLimitStatus(remaining);
            }

            previousRevealedCount = currentCount;
        }

        function getTodayStorageKey() {
            const today = new Date().toISOString().split('T')[0];
            return `reveals_${today}`;
        }

        function checkDailyLimitStatus(remainingGlobal) {
            const storageKey = getTodayStorageKey();
            const todayClicks = parseInt(localStorage.getItem(storageKey) || "0", 10);

            if (todayClicks >= DAILY_LIMIT) {
                statusMessage.innerText = `⚠️ You've reached your ${DAILY_LIMIT} reveals for today! (${remainingGlobal} total pieces left globally).`;
                revealLink.classList.add('disabled');
                revealLink.innerText = "Daily Limit Reached";
            } else {
                const leftToday = DAILY_LIMIT - todayClicks;
                statusMessage.innerText = `${remainingGlobal} pieces left globally. You have ${leftToday} reveal(s) left today.`;
            }
        }

        // -------------------------------------------------------------
        // Event Listeners
        // -------------------------------------------------------------
        revealLink.addEventListener('click', async function(event) {
            event.preventDefault();
            if (revealLink.classList.contains('disabled')) return;

            const storageKey = getTodayStorageKey();
            let todayClicks = parseInt(localStorage.getItem(storageKey) || "0", 10);

            if (todayClicks >= DAILY_LIMIT) return;

            const hiddenIndices = [];
            for (let i = 0; i < TOTAL_BLOCKS; i++) {
                if (!globallyRevealedBlocks.includes(i)) hiddenIndices.push(i);
            }

            if (hiddenIndices.length > 0) {
                const randomIndex = Math.floor(Math.random() * hiddenIndices.length);
                const blockToReveal = hiddenIndices[randomIndex];
                
                revealLink.classList.add('disabled');
                const originalText = revealLink.innerText;
                revealLink.innerText = "Revealing...";

                try {
                    await updateDoc(puzzleRef, {
                        revealed: arrayUnion(blockToReveal)
                    });

                    todayClicks++;
                    localStorage.setItem(storageKey, todayClicks);

                } catch (error) {
                    console.error("Error saving data to cloud:", error);
                    statusMessage.innerText = "Error syncing click with database.";
                } finally {
                    if (todayClicks < DAILY_LIMIT) {
                        revealLink.classList.remove('disabled');
                        revealLink.innerText = originalText;
                    } else {
                        revealLink.classList.add('disabled');
                        revealLink.innerText = "Daily Limit Reached";
                    }
                }
            }
        });

        // Hidden Reset Button Event Handler
        resetLink.addEventListener('click', async function(event) {
            event.preventDefault();
            if (confirm("Are you sure you want to reset the puzzle for everyone?")) {
                try {
                    // 1. Reset Firestore array
                    await setDoc(puzzleRef, { revealed: [] });
                    
                    // 2. Reset local daily click quota
                    const storageKey = getTodayStorageKey();
                    localStorage.setItem(storageKey, 0);

                    statusMessage.innerText = "Puzzle state successfully reset!";
                } catch (error) {
                    console.error("Reset error:", error);
                    statusMessage.innerText = "Error resetting puzzle state.";
                }
            }
        });
    </script>
</body>
</html>
