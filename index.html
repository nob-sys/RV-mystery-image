<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Mystery Image Reveal (Firebase)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        h1 {
            color: #333;
        }

        .image-container {
            position: relative;
            width: 500px;
            height: 400px;
            background-image: url('https://picsum.photos/500/400');
            background-size: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .overlay-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10 columns */
            grid-template-rows: repeat(8, 1fr);    /* 8 rows = 80 total blocks */
        }

        .block {
            background-color: #2c3e50;
            border: 0.5px solid #34495e;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

        .block.revealed {
            opacity: 0;
            pointer-events: none;
        }

        .reveal-btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s, opacity 0.2s;
        }

        .reveal-btn:hover {
            background-color: #0056b3;
        }

        /* Disabled state to prevent spamming and fast double-clicks */
        .reveal-btn.disabled {
            opacity: 0.6;
            pointer-events: none; /* Disables mouse clicks */
            cursor: not-allowed;
            background-color: #6c757d;
        }

        #status-message {
            margin-top: 15px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>🔍 Global Mystery Picture Reveal</h1>
    
    <div class="image-container">
        <div class="overlay-grid" id="grid"></div>
    </div>

    <a href="#" class="reveal-btn" id="reveal-link">Click to Reveal 1 Piece for Everyone!</a>
    
    <p id="status-message">Connecting to database...</p>

    <!-- Load Firebase v10 JavaScript SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            onSnapshot, 
            updateDoc, 
            setDoc, 
            arrayUnion 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDYvQKj4m0sPwJAH6tO7z7Ze7RYjrmlEJQ",
            authDomain: "rv-mystery-image.firebaseapp.com",
            projectId: "rv-mystery-image",
            storageBucket: "rv-mystery-image.firebasestorage.app",
            messagingSenderId: "44198416860",
            appId: "1:44198416860:web:2582c27e29a0c8dfbc7f19",
            measurementId: "G-LKXEPMXWKD"
        };

        // Initialize Firebase Services
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const puzzleRef = doc(db, "games", "mystery-puzzle-1");

        const gridContainer = document.getElementById('grid');
        const revealLink = document.getElementById('reveal-link');
        const statusMessage = document.getElementById('status-message');
        
        const TOTAL_BLOCKS = 80; // 10 cols x 8 rows
        const DAILY_LIMIT = 3;   // Maximum reveals allowed per user per day
        let globallyRevealedBlocks = [];

        // 1. Build the visual layout grid dynamically
        for (let i = 0; i < TOTAL_BLOCKS; i++) {
            const block = document.createElement('div');
            block.classList.add('block');
            block.setAttribute('data-id', i);
            gridContainer.appendChild(block);
        }

        // 2. Real-Time Cloud Synchronization Listener
        onSnapshot(puzzleRef, async (docSnap) => {
            if (!docSnap.exists()) {
                await setDoc(puzzleRef, { revealed: [] });
                globallyRevealedBlocks = [];
            } else {
                globallyRevealedBlocks = docSnap.data().revealed || [];
            }
            syncUI();
        });

        // 3. Update grid overlays and status messages
        function syncUI() {
            document.querySelectorAll('.block').forEach(block => {
                const id = parseInt(block.getAttribute('data-id'), 10);
                if (globallyRevealedBlocks.includes(id)) {
                    block.classList.add('revealed');
                } else {
                    block.classList.remove('revealed');
                }
            });

            const remaining = TOTAL_BLOCKS - globallyRevealedBlocks.length;
            if (remaining === 0) {
                statusMessage.innerText = "🎉 The picture is fully revealed for everyone!";
                revealLink.style.display = 'none';
            } else {
                checkDailyLimitStatus(remaining);
            }
        }

        // Helper: Get local storage key based on current date (YYYY-MM-DD)
        function getTodayStorageKey() {
            const today = new Date().toISOString().split('T')[0];
            return `reveals_${today}`;
        }

        // Helper: Check daily limit and update button messaging
        function checkDailyLimitStatus(remainingGlobal) {
            const storageKey = getTodayStorageKey();
            const todayClicks = parseInt(localStorage.getItem(storageKey) || "0", 10);

            if (todayClicks >= DAILY_LIMIT) {
                statusMessage.innerText = `⚠️ You've reached your ${DAILY_LIMIT} reveals for today! (${remainingGlobal} total pieces left globally).`;
                revealLink.classList.add('disabled');
                revealLink.innerText = "Daily Limit Reached";
            } else {
                const leftToday = DAILY_LIMIT - todayClicks;
                statusMessage.innerText = `${remainingGlobal} pieces left globally. You have ${leftToday} reveal(s) left today.`;
            }
        }

        // 4. Click Handler with Atomic Writes, Locking & Daily Limit
        revealLink.addEventListener('click', async function(event) {
            event.preventDefault();
            
            // Prevent click if locked/disabled
            if (revealLink.classList.contains('disabled')) return;

            const storageKey = getTodayStorageKey();
            let todayClicks = parseInt(localStorage.getItem(storageKey) || "0", 10);

            // Double check daily threshold
            if (todayClicks >= DAILY_LIMIT) {
                statusMessage.innerText = "⚠️ You've reached your daily reveal limit. Come back tomorrow!";
                return;
            }

            // Find all blocks currently hidden locally
            const hiddenIndices = [];
            for (let i = 0; i < TOTAL_BLOCKS; i++) {
                if (!globallyRevealedBlocks.includes(i)) {
                    hiddenIndices.push(i);
                }
            }

            if (hiddenIndices.length > 0) {
                // Select a random hidden block ID
                const randomIndex = Math.floor(Math.random() * hiddenIndices.length);
                const blockToReveal = hiddenIndices[randomIndex];
                
                // Temporarily disable button while writing to Firestore
                revealLink.classList.add('disabled');
                const originalText = revealLink.innerText;
                revealLink.innerText = "Revealing...";

                try {
                    // Atomic append using arrayUnion to handle simultaneous multi-user clicks
                    await updateDoc(puzzleRef, {
                        revealed: arrayUnion(blockToReveal)
                    });

                    // Save incremented count to local storage on successful write
                    todayClicks++;
                    localStorage.setItem(storageKey, todayClicks);

                } catch (error) {
                    console.error("Error saving data to cloud:", error);
                    statusMessage.innerText = "Error syncing click with the cloud database.";
                } finally {
                    // Re-enable button if limit hasn't been reached
                    if (todayClicks < DAILY_LIMIT) {
                        revealLink.classList.remove('disabled');
                        revealLink.innerText = originalText;
                    } else {
                        revealLink.classList.add('disabled');
                        revealLink.innerText = "Daily Limit Reached";
                    }
                }
            }
        });
    </script>
</body>
</html>
